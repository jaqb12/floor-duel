<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <title>The Floor — panel operatora</title>
  <link rel="stylesheet" href="css/operator.css">
  <!-- Players window styles: copied into the about:blank players window by display.js. -->
  <style id="display-css" media="not all">
    html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden; cursor: none; user-select: none; }
    body { font-family: "Segoe UI", system-ui, sans-serif; }
    .floor { position: relative; height: 100vh; display: flex; flex-direction: column; }
    .board, .duel { display: none; flex: 1; min-height: 0; }
    .floor[data-screen="board"] .board { display: flex; }
    .floor:not([data-screen="board"]) .duel { display: flex; }

    /* start board */
    .board { flex-direction: column; align-items: center; justify-content: center; gap: 5vh; padding: 4vh 5vw; }
    .logo { margin: 0; font-size: 15vh; font-weight: 900; letter-spacing: 0.08em;
      background: linear-gradient(90deg, #60a5fa, #c084fc, #f472b6); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .ranking { list-style: none; margin: 0; padding: 0; width: min(70vw, 1100px); font-size: 5vh; }
    .ranking.two-columns { columns: 2; column-gap: 5vw; width: 90vw; font-size: 4.2vh; }
    .ranking li { display: flex; gap: 1.5vw; break-inside: avoid; padding: 0.7vh 0; border-bottom: 1px solid #222; }
    .r-pos { color: #888; min-width: 3ch; text-align: right; }
    .r-name { flex: 1; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .r-score { font-variant-numeric: tabular-nums; color: #ddd; }

    /* duel */
    .duel { flex-direction: column; }
    .category { text-align: center; font-size: 6vh; font-weight: 800; padding: 1.5vh 2vw 1vh; text-transform: uppercase; letter-spacing: 0.06em; color: #e5e7eb; }
    .stage { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
    .photo { width: 100%; height: 100%; object-fit: contain; }
    .floor:not([data-screen="duel"]) .photo { visibility: hidden; }
    .reveal { position: absolute; left: 0; right: 0; bottom: 3vh; display: none; justify-content: center; align-items: center; gap: 3vw;
      padding: 2vh 3vw; background: rgba(0, 0, 0, 0.82); font-size: 8vh; font-weight: 800; }
    .reveal.visible { display: flex; }
    .reveal-tag { color: #000; background: #fbbf24; padding: 0 2vw; border-radius: 1.5vh; font-size: 6vh; }
    .message { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .floor[data-screen="ready"] .message, .floor[data-screen="finished"] .message { display: flex; }
    .message-title { font-size: 9vh; font-weight: 800; }
    .message-name { font-size: 16vh; font-weight: 900; }
    .message-name:empty { display: none; }

    .panels { display: flex; gap: 2vw; padding: 1.5vh 2vw 3vh; }
    .panel { --player: #fff; flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 2vw; min-width: 0;
      padding: 1.5vh 2.5vw; border-radius: 2vh; background: #111; border: 0.6vh solid #222; opacity: 0.4; transition: opacity 0.2s; }
    .panel.right { flex-direction: row-reverse; }
    .panel.active, .panel.winner { opacity: 1; border-color: var(--player); box-shadow: 0 0 4vh var(--player); }
    .floor[data-screen="ready"] .panel { opacity: 1; }
    .pname { font-size: 7vh; font-weight: 800; color: var(--player); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pclock { font-size: 13vh; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; }
    .pclock.low { color: #ff3b3b; }
    .panel.active .pclock.low { animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: 0.35; } }

    .paused { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
      background: rgba(0, 0, 0, 0.78); font-size: 20vh; font-weight: 900; letter-spacing: 0.1em; }
    .floor.is-paused .paused { display: flex; }
  </style>
</head>
<body>
  <header class="top">
    <h1>The Floor</h1>
    <span class="subtitle">panel operatora</span>
  </header>
  <p id="app-message" class="message"></p>

  <main class="columns">
    <section class="col" id="col-players">
      <h2>Gracze</h2>
      <form id="player-form" class="player-form" autocomplete="off">
        <div class="row">
          <input type="text" id="player-name" placeholder="Imię gracza" aria-label="Imię gracza">
          <input type="color" id="player-color" title="Kolor gracza" aria-label="Kolor gracza">
        </div>
        <select id="player-category" aria-label="Kategoria gracza"></select>
        <div class="buttons">
          <button type="submit" id="player-submit">Dodaj gracza</button>
          <button type="button" id="player-cancel" hidden>Anuluj</button>
        </div>
        <p id="player-message" class="message"></p>
      </form>
      <ol id="player-list" class="player-list"></ol>
      <p id="players-empty" class="placeholder">Brak graczy — dodaj pierwszego.</p>
      <button type="button" id="reset-scores" class="danger" hidden>Wyzeruj wyniki</button>
    </section>

    <section class="col" id="col-duel">
      <h2>Pojedynek</h2>

      <form id="duel-setup" class="duel-setup" autocomplete="off">
        <label>Wyzywający
          <span class="inline">
            <select id="duel-challenger"></select>
            <button type="button" id="duel-random" title="Losuj wyzywającego">🎲 Losuj</button>
          </span>
        </label>
        <label>Rywal <select id="duel-opponent"></select></label>
        <label>Kategoria <select id="duel-category"></select></label>
        <fieldset class="starts">
          <legend>Zaczyna odpowiadać</legend>
          <label class="check"><input type="radio" name="duel-first" value="challenger" checked> wyzywający</label>
          <label class="check"><input type="radio" name="duel-first" value="opponent"> rywal</label>
        </fieldset>
        <div class="buttons">
          <button type="submit" id="duel-start" class="primary" disabled>START (Enter)</button>
          <button type="button" id="duel-clear">Wyczyść</button>
        </div>
        <p id="duel-problem" class="message"></p>
      </form>

      <div id="duel-live" class="duel-live" hidden>
        <div class="live-head">
          <span id="live-category" class="live-category"></span>
          <span id="live-pool" class="note"></span>
        </div>
        <div class="preview"><img id="live-photo" alt=""></div>
        <div id="live-answer" class="live-answer"></div>
        <p id="live-hint" class="note"></p>
        <div class="clocks">
          <div id="live-left" class="clock-box"><span class="c-name"></span><span class="c-time"></span><span class="c-stats note"></span></div>
          <div id="live-right" class="clock-box"><span class="c-name"></span><span class="c-time"></span><span class="c-stats note"></span></div>
        </div>
        <div class="buttons live-buttons">
          <button type="button" id="live-correct" class="primary">DOBRZE (Spacja)</button>
          <button type="button" id="live-pass">PAS (P)</button>
          <button type="button" id="live-pause">PAUZA (Esc)</button>
        </div>
        <div id="live-result" class="live-result" hidden>
          <p id="live-winner" class="live-winner"></p>
          <div class="buttons">
            <button type="button" id="live-confirm" class="primary">Zatwierdź wynik</button>
          </div>
        </div>
        <button type="button" id="live-cancel" class="danger">Unieważnij pojedynek</button>
      </div>
    </section>

    <section class="col" id="col-categories">
      <h2>Kategorie</h2>
      <div class="buttons">
        <button type="button" id="pick-folder">Wybierz folder…</button>
        <button type="button" id="restore-folder" hidden>Wczytaj ostatni folder</button>
      </div>
      <p id="folder-name" class="folder-name"></p>
      <p id="folder-message" class="message"></p>
      <ul id="category-list" class="category-list"></ul>

      <h2 class="section-gap">Ekran graczy</h2>
      <div class="buttons">
        <button type="button" id="open-display">Otwórz ekran graczy</button>
        <button type="button" id="big-open" title="Tryb jednego ekranu: ekran graczy na całym panelu">Duży podgląd</button>
      </div>
      <p id="display-status" class="message"></p>

      <h2 class="section-gap">Ustawienia</h2>
      <form id="settings-form" class="settings">
        <label>Czas pojedynku (s) <input type="number" id="set-duel" step="1"></label>
        <label>Kara za pas (s) <input type="number" id="set-pass" step="1"></label>
        <label class="check"><input type="checkbox" id="set-sound"> Dźwięk</label>
        <label class="check"><input type="checkbox" id="set-hide"> Ukrywaj odpowiedź (tryb jednego ekranu)</label>
      </form>
    </section>
  </main>

  <div id="big-preview" class="big-preview" hidden>
    <div class="big-bar">
      <span class="note">Odpowiedź:</span>
      <span id="big-answer" class="big-answer"></span>
      <button type="button" id="big-close">Zamknij podgląd</button>
    </div>
    <div id="big-slot" class="big-slot"></div>
  </div>

  <input type="file" id="folder-input" webkitdirectory multiple hidden>

  <script src="js/logic.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/categories.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/display.js"></script>
  <script src="js/operator.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
