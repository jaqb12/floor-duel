<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <title>The Floor — spike file://</title>
  <style>
    body { font-family: "Segoe UI", system-ui, sans-serif; margin: 24px auto; padding: 0 16px; max-width: 1100px; background: #16181d; color: #e8e8e8; }
    h1 { margin: 0 0 4px; }
    .env { color: #9aa3ad; font-size: 14px; margin-bottom: 16px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border-bottom: 1px solid #2c3038; padding: 10px 8px; vertical-align: top; text-align: left; }
    td.st { font-weight: 700; width: 70px; }
    .OK { color: #4ade80; } .FAIL { color: #f87171; } .INFO { color: #fbbf24; } .PENDING { color: #6b7280; }
    .det { color: #b8bec7; font-size: 13px; white-space: pre-wrap; margin-top: 4px; }
    .hint { color: #8b929c; font-size: 13px; }
    button { font: inherit; font-size: 14px; padding: 5px 12px; margin: 4px 6px 0 0; cursor: pointer; }
    textarea { width: 100%; height: 220px; background: #0d0e11; color: #ddd; font-family: Consolas, monospace; font-size: 12px; box-sizing: border-box; }
  </style>
  <!-- Copied into the players window, the same way the real app will do it. -->
  <style id="display-css" media="not all">
    html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: "Segoe UI", sans-serif; cursor: none; overflow: hidden; }
    #spike-marker { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 16px; }
    #spike-marker h1 { margin: 0; font-size: 48px; }
    #spike-marker img { max-width: 80vw; max-height: 60vh; object-fit: contain; }
    #spike-marker p { margin: 0; font-size: 22px; color: #9aa3ad; }
  </style>
</head>
<body>
  <h1>The Floor — spike <code>file://</code></h1>
  <div class="env" id="env"></div>

  <table>
    <thead><tr><th>Test</th><th>Wynik</th></tr></thead>
    <tbody id="tests"></tbody>
  </table>

  <h2>Raport</h2>
  <p class="hint">Wyniki są zapamiętywane w tej przeglądarce między odświeżeniami. Gdy wszystko przejdziesz, skopiuj raport i wklej go w Claude Code.</p>
  <button id="copy">Kopiuj raport</button>
  <button id="reset">Wyczyść wyniki spike</button>
  <textarea id="report" readonly></textarea>

  <input type="file" id="dir-input" webkitdirectory multiple hidden>

<script>
(function () {
  'use strict';

  const RESULTS_KEY = 'thefloor.spike.results';
  const MARKER_KEY = 'thefloor.spike.marker';
  const SESSION_KEY = 'thefloor.spike.session';
  const DISPLAY_FLAG = 'thefloor.spike.displayOpened';
  const DISPLAY_NAME = 'floor-display';
  const IMAGE_RE = /\.(jpe?g|png|webp|gif|bmp|avif|svg)$/i;

  // A new tab or browser restart has empty sessionStorage; F5 keeps it.
  const freshTab = !sessionStorage.getItem(SESSION_KEY);
  sessionStorage.setItem(SESSION_KEY, '1');

  let results = {};
  try { results = JSON.parse(localStorage.getItem(RESULTS_KEY)) || {}; } catch (e) { results = {}; }

  let sampleImage = null;   // a File picked by one of the folder tests
  let displayWin = null;
  let browserInfo = navigator.userAgent;

  const TESTS = [
    { id: 'picker', label: 'showDirectoryPicker z file://',
      hint: 'Kliknij i wskaż folder samples/Kategorie. Powinny pojawić się 3 kategorie.',
      actions: [['Wybierz folder (showDirectoryPicker)', testPicker]] },
    { id: 'idb', label: 'Uchwyt folderu w IndexedDB + requestPermission po restarcie',
      hint: 'Uchwyt zapisuje się po teście wyżej. Zamknij CAŁĄ przeglądarkę, otwórz spike ponownie i kliknij przycisk.',
      actions: [['Wczytaj ostatni folder', testIdbRestore]] },
    { id: 'webkitdir', label: 'Fallback <input webkitdirectory>',
      hint: 'Kliknij i wskaż folder samples/Kategorie (przeglądarka zapyta o zgodę na „przesłanie” — to tylko lokalny odczyt).',
      actions: [['Wybierz folder (input)', () => document.getElementById('dir-input').click()]] },
    { id: 'localStorage', label: 'localStorage przetrwa zamknięcie przeglądarki',
      hint: 'Znacznik zapisuje się przy pierwszym otwarciu. Po restarcie przeglądarki sprawdź, czy jest odczytany, i potwierdź.',
      actions: [['Potwierdzam: przetrwał restart', () => manual('localStorage', 'OK')],
                ['Nie przetrwał', () => manual('localStorage', 'FAIL')]] },
    { id: 'display', label: 'window.open(\'\', \'floor-display\') + DOM + obrazek z blob URL',
      hint: 'Otwiera okno graczy. Powinien być widoczny napis, obrazek i rosnący licznik klatek.',
      actions: [['Otwórz okno graczy', openDisplay]] },
    { id: 'displayKeys', label: 'Klawiatura w oknie graczy dociera do operatora',
      hint: 'Kliknij w okno graczy i naciśnij Spację albo P.', actions: [] },
    { id: 'recover', label: 'Odzyskanie okna graczy po odświeżeniu operatora (F5)',
      hint: 'Przy otwartym oknie graczy naciśnij F5 tutaj. Strona sama spróbuje odzyskać okno (bez kliknięcia); przycisk próbuje z kliknięciem.',
      actions: [['Odzyskaj okno (kliknięciem)', () => recoverDisplay(true)]] },
    { id: 'takeover', label: 'Przejęcie okna po F5: nawigacja okna graczy do about:blank (nowy origin)',
      hint: 'Uruchamia się samo, gdy odzyskanie rzuci SecurityError. Okno powinno zostać na miejscu (i w pełnym ekranie, jeśli było) i znów pokazać obrazek.',
      actions: [['Przejmij okno (kliknięciem)', () => takeOverDisplay(true)]] },
    { id: 'reconnect', label: 'Okno graczy samo łączy się z operatorem po F5 (przez window.opener)',
      hint: 'Działa samo po F5 przy otwartym oknie graczy. Jeśli tu nic nie ma — przeczytaj, co pisze na dole okna graczy.',
      actions: [] },
  ];

  // ---------- results ----------

  function setResult(id, status, detail) {
    results[id] = { status, detail, at: new Date().toLocaleString('pl-PL') };
    try { localStorage.setItem(RESULTS_KEY, JSON.stringify(results)); } catch (e) { /* reported by localStorage test */ }
    render();
  }

  function manual(id, status) {
    const prev = results[id] ? results[id].detail : '';
    setResult(id, status, (prev ? prev + '\n' : '') + 'Potwierdzone ręcznie przez użytkownika.');
  }

  // Appends a line to a test's log instead of overwriting earlier attempts.
  function logResult(id, status, line) {
    const prev = results[id] ? results[id].detail.split('\n').slice(-5) : [];
    prev.push(new Date().toLocaleTimeString('pl-PL') + ' ' + line);
    setResult(id, status, prev.join('\n'));
  }

  function errText(e) { return (e && e.name ? e.name + ': ' : '') + (e && e.message ? e.message : String(e)); }

  // ---------- rendering ----------

  function render() {
    const tbody = document.getElementById('tests');
    tbody.textContent = '';
    for (const t of TESTS) {
      const r = results[t.id];
      const tr = document.createElement('tr');
      const tdLabel = document.createElement('td');
      const title = document.createElement('div');
      title.textContent = t.label;
      title.style.fontWeight = '600';
      const hint = document.createElement('div');
      hint.className = 'hint';
      hint.textContent = t.hint;
      tdLabel.append(title, hint);
      for (const [text, fn] of t.actions) {
        const b = document.createElement('button');
        b.textContent = text;
        b.addEventListener('click', fn);
        tdLabel.append(b);
      }
      if (r) {
        const det = document.createElement('div');
        det.className = 'det';
        det.textContent = r.detail + '  [' + r.at + ']';
        tdLabel.append(det);
      }
      const tdSt = document.createElement('td');
      tdSt.className = 'st ' + (r ? r.status : 'PENDING');
      tdSt.textContent = r ? r.status : '—';
      tr.append(tdLabel, tdSt);
      tbody.append(tr);
    }
    document.getElementById('report').value = buildReport();
  }

  function buildReport() {
    const lines = ['Przeglądarka: ' + browserInfo, 'URL: ' + location.href, 'isSecureContext: ' + window.isSecureContext + ', origin: ' + location.origin, ''];
    for (const t of TESTS) {
      const r = results[t.id];
      lines.push((r ? r.status : '—') + ' | ' + t.id + ' | ' + (r ? r.detail.replace(/\n/g, ' / ') : 'nie uruchomiono'));
    }
    return lines.join('\n');
  }

  async function describeBrowser() {
    try {
      if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
        const v = await navigator.userAgentData.getHighEntropyValues(['fullVersionList', 'platformVersion']);
        const brands = (v.fullVersionList || []).filter(b => !/Not.?A.?Brand/i.test(b.brand)).map(b => b.brand + ' ' + b.version);
        browserInfo = brands.join(', ') + ' | ' + v.platform + ' ' + v.platformVersion;
      }
    } catch (e) { /* keep userAgent */ }
    document.getElementById('env').textContent = browserInfo + ' · isSecureContext=' + window.isSecureContext +
      ' · protokół=' + location.protocol + ' · nowa karta/sesja=' + (freshTab ? 'tak' : 'nie (F5)');
    render();
  }

  // ---------- folder helpers ----------

  async function describeDirHandle(root) {
    const cats = [];
    let rootFiles = 0;
    for await (const [name, handle] of root.entries()) {
      if (handle.kind !== 'directory') { rootFiles++; continue; }
      let images = 0, skipped = 0;
      for await (const [fname, fh] of handle.entries()) {
        if (fh.kind !== 'file') continue;
        if (IMAGE_RE.test(fname)) {
          images++;
          if (!sampleImage) sampleImage = await fh.getFile();
        } else {
          skipped++;
        }
      }
      cats.push(name + ' (' + images + ' obr., pominięte: ' + skipped + ')');
    }
    return 'Folder „' + root.name + '”: ' + cats.length + ' kategorii: ' + cats.join('; ') +
      (rootFiles ? '; plików w korzeniu: ' + rootFiles : '');
  }

  // ---------- IndexedDB ----------

  function idbOpen() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open('thefloor-spike', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('handles');
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function idbRequest(mode, fn) {
    const db = await idbOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('handles', mode);
      const req = fn(tx.objectStore('handles'));
      tx.oncomplete = () => { db.close(); resolve(req.result); };
      tx.onerror = () => { db.close(); reject(tx.error); };
    });
  }

  const idbPut = (key, value) => idbRequest('readwrite', s => s.put(value, key));
  const idbGet = key => idbRequest('readonly', s => s.get(key));

  // ---------- tests ----------

  async function testPicker() {
    if (typeof window.showDirectoryPicker !== 'function') {
      setResult('picker', 'FAIL', 'window.showDirectoryPicker nie istnieje w tej przeglądarce / kontekście.');
      return;
    }
    let root;
    try {
      root = await window.showDirectoryPicker({ id: 'thefloor', mode: 'read' });
    } catch (e) {
      setResult('picker', e.name === 'AbortError' ? 'INFO' : 'FAIL', 'Wybór przerwany lub błąd: ' + errText(e));
      return;
    }
    try {
      setResult('picker', 'OK', await describeDirHandle(root));
    } catch (e) {
      setResult('picker', 'FAIL', 'Wybrano folder, ale odczyt zawartości nie działa: ' + errText(e));
      return;
    }
    try {
      await idbPut('root', root);
      const back = await idbGet('root');
      setResult('idb', 'INFO', 'Zapis uchwytu „' + back.name + '” do IndexedDB OK (odczyt w tej sesji działa). ' +
        'Teraz zamknij całą przeglądarkę, otwórz spike i kliknij „Wczytaj ostatni folder”.');
    } catch (e) {
      setResult('idb', 'FAIL', 'Nie da się zapisać uchwytu w IndexedDB: ' + errText(e));
    }
  }

  async function checkIdbOnLoad() {
    let handle;
    try { handle = await idbGet('root'); } catch (e) {
      if (results.picker) setResult('idb', 'FAIL', 'Odczyt IndexedDB przy starcie nie działa: ' + errText(e));
      return;
    }
    if (!handle || !freshTab || !results.idb || results.idb.status !== 'INFO') return;
    let perm = '?';
    try { perm = await handle.queryPermission({ mode: 'read' }); } catch (e) { perm = 'błąd: ' + errText(e); }
    setResult('idb', 'INFO', 'Po ponownym otwarciu: uchwyt „' + handle.name + '” odczytany z IndexedDB, queryPermission=' + perm +
      '. Kliknij „Wczytaj ostatni folder”.');
  }

  async function testIdbRestore() {
    let handle;
    try { handle = await idbGet('root'); } catch (e) {
      setResult('idb', 'FAIL', 'Odczyt IndexedDB nie działa: ' + errText(e));
      return;
    }
    if (!handle) {
      setResult('idb', 'FAIL', 'Brak zapisanego uchwytu — najpierw uruchom test showDirectoryPicker.');
      return;
    }
    try {
      const before = await handle.queryPermission({ mode: 'read' });
      const after = before === 'granted' ? before : await handle.requestPermission({ mode: 'read' });
      if (after !== 'granted') {
        setResult('idb', 'FAIL', 'requestPermission zwróciło „' + after + '” (przed: ' + before + ').');
        return;
      }
      const desc = await describeDirHandle(handle);
      setResult('idb', freshTab ? 'OK' : 'INFO', 'Uprawnienie przed: ' + before + ', po: ' + after + '. ' + desc +
        (freshTab ? '' : '\nUwaga: to była ta sama karta (F5), a nie restart przeglądarki — zamknij przeglądarkę i powtórz.'));
    } catch (e) {
      setResult('idb', 'FAIL', 'Błąd przy requestPermission / odczycie: ' + errText(e));
    }
  }

  function onDirInput(e) {
    const files = Array.from(e.target.files || []);
    if (!files.length) {
      setResult('webkitdir', 'INFO', 'Nie wybrano plików (anulowano?).');
      return;
    }
    const withPath = files.filter(f => f.webkitRelativePath && f.webkitRelativePath.includes('/'));
    const cats = new Set();
    for (const f of withPath) {
      const parts = f.webkitRelativePath.split('/');
      if (parts.length === 3) cats.add(parts[1]);
      if (!sampleImage && IMAGE_RE.test(f.name)) sampleImage = f;
    }
    const sample = withPath.slice(0, 3).map(f => f.webkitRelativePath).join(', ');
    setResult('webkitdir', withPath.length === files.length ? 'OK' : 'FAIL',
      'Plików: ' + files.length + ', z webkitRelativePath: ' + withPath.length + ', kategorie: ' + Array.from(cats).join(', ') +
      '\nPrzykłady: ' + sample);
  }

  function checkLocalStorageOnLoad() {
    try {
      const marker = localStorage.getItem(MARKER_KEY);
      if (!marker) {
        localStorage.setItem(MARKER_KEY, new Date().toLocaleString('pl-PL'));
        setResult('localStorage', 'INFO', 'Zapisano znacznik ' + localStorage.getItem(MARKER_KEY) +
          '. Zamknij całą przeglądarkę i otwórz spike ponownie.');
      } else if (freshTab && results.localStorage && results.localStorage.status === 'INFO') {
        setResult('localStorage', 'INFO', 'Odczytano znacznik zapisany ' + marker +
          ' (nowa karta/sesja). Jeśli przeglądarka była w międzyczasie zamknięta — potwierdź przyciskiem.');
      }
    } catch (e) {
      setResult('localStorage', 'FAIL', 'localStorage rzuca wyjątek: ' + errText(e));
    }
  }

  // ---------- players window ----------

  function fallbackImageBlob() {
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360"><rect width="640" height="360" fill="#2a9d8f"/>' +
      '<circle cx="320" cy="180" r="120" fill="#f4a261"/><text x="320" y="195" font-size="40" text-anchor="middle" fill="#000">blob SVG</text></svg>';
    return new Blob([svg], { type: 'image/svg+xml' });
  }

  // Builds the players window DOM from this (operator) window.
  async function buildDisplay(win, testId) {
    const doc = win.document;
    doc.title = 'The Floor — ekran graczy';
    doc.head.textContent = '';
    doc.body.textContent = '';
    const style = doc.createElement('style');
    style.textContent = document.getElementById('display-css').textContent;
    doc.head.append(style);

    const box = doc.createElement('div');
    box.id = 'spike-marker';
    const h1 = doc.createElement('h1');
    h1.textContent = 'Ekran graczy (spike) — zbudowany o ' + new Date().toLocaleTimeString('pl-PL');
    const img = doc.createElement('img');
    const fps = doc.createElement('p');
    const keys = doc.createElement('p');
    keys.textContent = 'Naciśnij Spację lub P w tym oknie.';
    const link = doc.createElement('p');
    link.id = 'spike-link';
    box.append(h1, img, fps, keys, link);
    doc.body.append(box);
    injectReconnectScript(doc);

    startRafLoop(win, fps);
    doc.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'KeyP') {
        e.preventDefault();
        keys.textContent = 'Odebrano: ' + e.code;
        setResult('displayKeys', 'OK', 'keydown z okna graczy (' + e.code + ') obsłużony przez kod operatora.');
      }
    });

    const source = sampleImage || fallbackImageBlob();
    const url = URL.createObjectURL(source);
    img.src = url;
    try {
      await img.decode();
      (testId === 'display' ? setResult : logResult)(testId, 'OK', 'DOM zbudowany, CSS skopiowany, obrazek z blob URL (' + (sampleImage ? 'plik „' + sampleImage.name + '”' : 'wygenerowany SVG') +
        ') zdekodowany: ' + img.naturalWidth + '×' + img.naturalHeight + '.');
    } catch (e) {
      (testId === 'display' ? setResult : logResult)(testId, 'FAIL', 'DOM zbudowany, ale obrazek z blob URL nie dekoduje się: ' + errText(e));
    }
  }

  // Runs inside the players window (its own realm, survives operator F5).
  // When the operator page reloads, window.opener gets a new FloorSpike.id and we hand ourselves over.
  const RECONNECT_SRC = `
    (function () {
      if (window.__spikeReconnect) return;
      window.__spikeReconnect = true;
      var lastId = window.opener && window.opener.FloorSpike ? window.opener.FloorSpike.id : null;
      setInterval(function () {
        var out = document.getElementById('spike-link');
        try {
          if (!window.opener) { if (out) out.textContent = 'Połączenie: window.opener = null'; return; }
          var api = window.opener.FloorSpike;
          if (!api) { if (out) out.textContent = 'Połączenie: operator jeszcze się ładuje…'; return; }
          if (api.id !== lastId) { lastId = api.id; api.adopt(window); }
          if (out) out.textContent = 'Połączenie z operatorem: OK (sesja ' + api.id + ')';
        } catch (e) {
          if (out) out.textContent = 'Połączenie z operatorem: dostęp rzuca ' + e.name + ': ' + e.message;
        }
      }, 500);
    })();`;

  function injectReconnectScript(doc) {
    const script = doc.createElement('script');
    script.textContent = RECONNECT_SRC;
    doc.head.append(script);
  }

  // Counts frames using the players window's own requestAnimationFrame.
  function startRafLoop(win, out) {
    let frames = 0, last = performance.now();
    function frame() {
      if (win.closed) return;
      frames++;
      const now = performance.now();
      if (now - last >= 1000) {
        out.textContent = 'requestAnimationFrame okna graczy: ' + Math.round(frames * 1000 / (now - last)) + ' kl./s';
        frames = 0;
        last = now;
      }
      win.requestAnimationFrame(frame);
    }
    win.requestAnimationFrame(frame);
  }

  function openDisplay() {
    const win = window.open('', DISPLAY_NAME, 'popup,width=1280,height=720');
    if (!win) {
      setResult('display', 'FAIL', 'window.open zwróciło null (zablokowane wyskakujące okno?).');
      return;
    }
    displayWin = win;
    try { localStorage.setItem(DISPLAY_FLAG, '1'); } catch (e) { /* ignore */ }
    buildDisplay(win, 'display').catch(e =>
      setResult('display', 'FAIL', 'Okno otwarte, ale dostęp do jego DOM rzuca: ' + errText(e)));
  }

  // Tries to get a reference to an already open players window.
  function recoverDisplay(withClick) {
    const how = withClick ? 'z kliknięciem' : 'automatycznie przy starcie (bez kliknięcia)';
    let win;
    try {
      win = window.open('', DISPLAY_NAME);
    } catch (e) {
      logResult('recover', 'FAIL', how + ': window.open rzuca: ' + errText(e));
      return;
    }
    if (!win) {
      logResult('recover', withClick ? 'FAIL' : 'INFO', how + ': window.open zwróciło null (zablokowane?).' +
        (withClick ? '' : ' Spróbuj przyciskiem.'));
      return;
    }
    let marker;
    try {
      marker = win.document.getElementById('spike-marker');
    } catch (e) {
      logResult('recover', 'FAIL', how + ': referencja jest, ale dostęp do document rzuca: ' + errText(e) +
        '\n→ próbuję przejąć okno nawigacją do about:blank.');
      takeOverDisplay(withClick);
      return;
    }
    if (!marker) {
      let diag;
      try {
        diag = 'href=' + win.location.href + ', title=„' + win.document.title + '”, elementów w body=' +
          (win.document.body ? win.document.body.childElementCount : 'brak body');
      } catch (e) { diag = 'diagnostyka rzuca: ' + errText(e); }
      logResult('recover', 'INFO', how + ': dostałem okno bez znacznika spike (' + diag + '). NIE zamykam go. ' +
        'Napisz, czy widzisz teraz dwa okna graczy (stare z obrazkiem + nowe puste), czy jedno wyczyszczone.');
      return;
    }
    displayWin = win;
    logResult('recover', 'INFO', how + ': okno odzyskane, document dostępny. Przebudowuję DOM z nowym blob URL…');
    buildDisplay(win, 'recover').catch(e =>
      logResult('recover', 'FAIL', how + ': okno odzyskane, ale przebudowa DOM rzuca: ' + errText(e)));
  }

  // Cross-origin we may still set location. A new about:blank inherits the origin of
  // the navigating (current operator) document, so DOM access works again.
  function takeOverDisplay(withClick) {
    const how = withClick ? 'z kliknięciem' : 'automatycznie';
    let win;
    try {
      win = window.open('', DISPLAY_NAME);
      if (!win) { logResult('takeover', 'FAIL', how + ': window.open zwróciło null.'); return; }
      win.location.href = 'about:blank';
    } catch (e) {
      logResult('takeover', 'FAIL', how + ': nawigacja okna graczy rzuca: ' + errText(e));
      return;
    }
    const started = performance.now();
    const timer = setInterval(() => {
      let ready = false;
      try { ready = win.document.readyState === 'complete' && !win.document.getElementById('spike-marker'); } catch (e) { /* still old origin */ }
      if (ready) {
        clearInterval(timer);
        displayWin = win;
        logResult('takeover', 'INFO', how + ': po ' + Math.round(performance.now() - started) + ' ms document dostępny. Przebudowuję DOM…');
        buildDisplay(win, 'takeover').catch(e => logResult('takeover', 'FAIL', 'Przebudowa rzuca: ' + errText(e)));
      } else if (performance.now() - started > 3000) {
        clearInterval(timer);
        logResult('takeover', 'FAIL', how + ': po 3 s document dalej niedostępny (okno zamknięte: ' + win.closed + ').' +
          '\n→ w aplikacji: komunikat „Zamknij okno graczy i otwórz je ponownie”.');
      }
    }, 50);
  }

  // ---------- start ----------

  window.FloorSpike = {
    id: Math.random().toString(36).slice(2, 7),
    adopt(win) {
      displayWin = win;
      logResult('reconnect', 'INFO', 'Okno graczy zgłosiło się samo (sesja ' + this.id + '). Przebudowuję DOM…');
      buildDisplay(win, 'reconnect').catch(e =>
        logResult('reconnect', 'FAIL', 'Zgłosiło się, ale przebudowa rzuca: ' + errText(e)));
    },
  };

  document.getElementById('dir-input').addEventListener('change', onDirInput);
  document.getElementById('copy').addEventListener('click', async () => {
    const ta = document.getElementById('report');
    ta.value = buildReport();
    try {
      await navigator.clipboard.writeText(ta.value);
    } catch (e) {
      ta.select();
      document.execCommand('copy');
    }
  });
  document.getElementById('reset').addEventListener('click', async () => {
    for (const k of [RESULTS_KEY, MARKER_KEY, DISPLAY_FLAG]) localStorage.removeItem(k);
    try { await idbRequest('readwrite', s => s.clear()); } catch (e) { /* ignore */ }
    results = {};
    location.reload();
  });

  render();
  describeBrowser();
  checkLocalStorageOnLoad();
  checkIdbOnLoad();
  if (localStorage.getItem(DISPLAY_FLAG) && !freshTab) recoverDisplay(false);
})();
</script>
</body>
</html>
